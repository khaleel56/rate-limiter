name: CI/CD Pipeline for Docker App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

     # Step 2: Login to Docker Hub (or other registry)
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

          # Step to build the Docker image
    - name: Build Docker Image
      run: docker build -t khaleel56/rate-limiter-node-app:latest .

         # Step to push the image to Docker Hub
    - name: Push Docker image
      run: docker push khaleel56/rate-limiter-node-app:latest
    

      
