name: CI/CD to lint check

on:
  push: 
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build: build to lint for application
  runs-on: ubuntu-latest

  steps:
  - name: checkout to repository
    uses: actions/checkout@v3

  - name: Set up Node.js
    uses: actions/set-node@v3
    with:
      node-version:'16'

  - name: Install dependencies
    uses: npm install

  - name: Run ESLint
    uses: npx eslint . --ext .js,.jsx,.ts,.tsx --config .eslintrc.json

  
